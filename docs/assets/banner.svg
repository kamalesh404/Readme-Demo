<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="240">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#010409" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5722" />
      <stop offset="100%" stop-color="#FF9800" />
    </linearGradient>
  </defs>

  <rect width="900" height="240" rx="16" fill="url(#bg)" stroke="#30363d" stroke-width="1.5"/>

  <!-- Document Template Graphic -->
  <g transform="translate(65, 40)">
    <rect width="115" height="155" rx="8" fill="#21262d" stroke="#FF5722" stroke-width="2"/>
    <rect x="15" y="20" width="85" height="12" rx="4" fill="#FF5722"/>
    <rect x="15" y="42" width="60" height="8" rx="3" fill="#8b949e"/>
    <rect x="15" y="58" width="75" height="8" rx="3" fill="#8b949e"/>
    <!-- Code block mockup -->
    <rect x="15" y="76" width="85" height="40" rx="4" fill="#0d1117" stroke="#30363d"/>
    <line x1="22" y1="88" x2="60" y2="88" stroke="#58a6ff" stroke-width="2"/>
    <line x1="22" y1="98" x2="80" y2="98" stroke="#7ee787" stroke-width="2"/>
    <!-- Badges mockup -->
    <rect x="15" y="126" width="38" height="12" rx="6" fill="#1f6feb"/>
    <rect x="58" y="126" width="42" height="12" rx="6" fill="#238636"/>
  </g>

  <!-- Typography -->
  <text x="220" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="url(#orangeGrad)" letter-spacing="1.5">
    Readme-Demo
  </text>
  <text x="220" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#8b949e">
    Modern GitHub Profile &amp; Project Showcase Starter Kit
  </text>

  <!-- Feature Tags -->
  <g transform="translate(220, 155)">
    <rect x="0" y="0" width="130" height="24" rx="12" fill="#21262d" stroke="#30363d"/>
    <text x="65" y="16" font-family="sans-serif" font-size="11" fill="#FF7043" font-weight="600" text-anchor="middle">MODULAR TEMPLATES</text>

    <rect x="140" y="0" width="115" height="24" rx="12" fill="#21262d" stroke="#30363d"/>
    <text x="197" y="16" font-family="sans-serif" font-size="11" fill="#58a6ff" font-weight="600" text-anchor="middle">DYNAMIC BADGES</text>

    <rect x="265" y="0" width="125" height="24" rx="12" fill="#21262d" stroke="#30363d"/>
    <text x="327" y="16" font-family="sans-serif" font-size="11" fill="#7ee787" font-weight="600" text-anchor="middle">SNAKE ANIMATION</text>

    <rect x="400" y="0" width="120" height="24" rx="12" fill="#21262d" stroke="#30363d"/>
    <text x="460" y="16" font-family="sans-serif" font-size="11" fill="#d2a8ff" font-weight="600" text-anchor="middle">CLEAN MARKDOWN</text>
  </g>
</svg>
